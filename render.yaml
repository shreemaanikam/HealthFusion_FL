# render.yaml — HealthFusion_FL backend deployment on Render.com
# https://render.com/docs/blueprint-spec
#
# Deploy: Connect GitHub repo at https://render.com → New → Blueprint
# This spec provisions:
#   1. A Python web service (FastAPI backend)
#   2. A managed PostgreSQL database (Render free tier)
#
# ⚠️  Before deploying, set these secrets in the Render dashboard:
#     JWT_SECRET_KEY
#     OPENROUTER_API_KEY (optional)
#
# All other environment variables are set below.

services:
  - type: web
    name: healthfusion-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: >
      uvicorn app.main:app
      --app-dir backend
      --host 0.0.0.0
      --port $PORT
      --workers 1
      --log-level info
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # --- Application ---
      - key: APP_NAME
        value: HealthFusion_FL
      - key: APP_ENV
        value: production
      - key: DEMO_MODE
        value: "false"
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO

      # --- Database (Render auto-injects DATABASE_URL from the postgres service) ---
      - key: DATABASE_URL
        fromDatabase:
          name: healthfusion-db
          property: connectionString

      # --- Authentication (set JWT_SECRET_KEY in Render dashboard as a Secret) ---
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: JWT_SECRET_KEY
        sync: false   # Render Secret — set manually in the dashboard

      # --- CORS: set to the real Vercel frontend origin(s) in the dashboard ---
      # e.g. https://your-project.vercel.app  (no trailing slash, no localhost in prod)
      - key: CORS_ORIGINS
        sync: false

      # --- OpenRouter (optional — set in Render dashboard as a Secret) ---
      - key: OPENROUTER_API_KEY
        sync: false   # Render Secret — set manually in the dashboard
      - key: OPENROUTER_MODEL
        value: qwen/qwen3.8-27b:free
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1

      # --- Federated Learning ---
      - key: FEDERATION_MODE
        value: iid
      - key: FL_NUM_ROUNDS
        value: "5"
      - key: FL_MIN_CLIENTS
        value: "3"

      # --- Privacy ---
      - key: DP_ENABLED
        value: "false"
      - key: DP_EPSILON
        value: "1.0"

databases:
  - name: healthfusion-db
    databaseName: healthfusion
    user: healthfusion
    plan: free   # Render free PostgreSQL (90 days, then upgrade or recreate)
